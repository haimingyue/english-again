# Activate only after Certbot has issued this domain's certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name english.tlpy8.com 47.120.46.32;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://english.tlpy8.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name english.tlpy8.com;
    ssl_certificate /etc/letsencrypt/live/english.tlpy8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.tlpy8.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EnglishAgainTLS:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/snippets/english-again-static.conf;
    include /etc/nginx/snippets/english-again-analytics.conf;
    access_log /var/log/nginx/english-again.access.log;
    error_log /var/log/nginx/english-again.error.log;
}
