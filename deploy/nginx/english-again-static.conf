root /var/www/english-again/current;
index index.html;
charset utf-8;
server_tokens off;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Ubuntu enables gzip globally; compress text assets, not media downloads.
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}
location ~ /\. {
    deny all;
}
location /_nuxt/ {
    expires 1y;
    try_files $uri =404;
}
location /assets/ {
    expires 1d;
    try_files $uri =404;
}
location /brand/ {
    expires 1h;
    try_files $uri =404;
}
location / {
    # Pre-rendered pages and legacy .html aliases; missing paths stay 404.
    expires -1;
    try_files $uri $uri/ $uri.html =404;
}
error_page 404 /404.html;
location = /404.html {
    internal;
    expires -1;
}
