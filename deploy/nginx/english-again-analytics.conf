# Include in the HTTPS server block only.
location = /admin { return 302 /admin/; }
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8091;
    include /etc/nginx/snippets/english-again-analytics-proxy.conf;
}
location = /api/analytics/collect {
    limit_req zone=ea_collect burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8091;
    include /etc/nginx/snippets/english-again-analytics-proxy.conf;
}
location = /api/analytics/login {
    limit_req zone=ea_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8091;
    include /etc/nginx/snippets/english-again-analytics-proxy.conf;
}
location ^~ /api/analytics/ {
    proxy_pass http://127.0.0.1:8091;
    include /etc/nginx/snippets/english-again-analytics-proxy.conf;
    proxy_read_timeout 120s;
}
