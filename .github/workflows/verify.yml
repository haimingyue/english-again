name: Build and verify website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 scripts/check_project.py
      - run: npm run generate
      - run: npm run check:static
      - run: npx playwright install --with-deps chromium
      - name: Test generated site
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory .output/public &
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ > /dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e
      - name: Upload deployable static website
        uses: actions/upload-artifact@v4
        with:
          name: english-again-static
          path: .output/public/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
